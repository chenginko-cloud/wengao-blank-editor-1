<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>空白文稿编辑器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232b5cd9'/%3E%3Cg stroke='%23fff' stroke-width='4.5' stroke-linecap='round'%3E%3Cpath d='M17 21h30M17 32h30M17 43h19'/%3E%3C/g%3E%3C/svg%3E">
<script src="route.js?rev=4632f7a2f225"></script>
<link rel="stylesheet" href="editor.css?rev=a219ac54f143">
<script src="model.js?rev=b0ad08dc2443" defer></script>
<script src="app.js?rev=ca6cc72943e9" defer></script>
<script src="sync.js?rev=3a0322fbf3b5" defer></script>

</head>
<body>
<div class="app">
  <div id="drawerShade" class="drawerShade" hidden></div>
  <aside class="sidebar" id="sidebar" aria-label="三级目录">
    <div class="sideHead"><div><h1>文稿目录</h1><span>三级可编辑目录</span></div><button id="closeDrawer" class="icon mobileOnly" aria-label="关闭目录">✕</button></div>
    <button id="allArticles" class="allButton active">全部文稿 <span id="totalCount">0</span></button>
    <div class="treeHead"><span>目录</span><button id="addRoot" class="smallButton">＋ 一级目录</button></div>
    <nav id="tree" class="tree" aria-label="目录树"></nav>
    <div class="sideFoot"><button id="unfiled" class="allButton">未分类 <span id="unfiledCount">0</span></button><p>本机保存 · 可连接多端同步</p></div>
  </aside>
  <main class="content">
    <header class="listBar">
      <button id="openDrawer" class="icon mobileOnly" aria-label="打开目录">☰</button>
      <div class="listTitle"><h2 id="currentTitle">全部文稿</h2><span id="currentCount">0 篇</span></div>
      <input id="search" class="search" type="search" placeholder="搜索标题或正文" aria-label="搜索标题或正文">
      <button id="syncButton" class="subtleButton syncButton" type="button" aria-label="跨设备同步：未连接">☁ 未连接</button>
      <button id="backupButton" class="subtleButton" title="导入或导出 JSON">导入 / 导出</button>
      <button id="newArticle" class="primaryButton">＋ 新建文稿</button>
    </header>
    <div id="articles" class="articleList" aria-live="polite"></div>
  </main>
</div>
<section id="reader" class="reader" aria-label="文稿阅读页" hidden>
  <header class="readerBar">
    <button id="backReader" class="icon backButton" aria-label="返回文稿列表">←</button>
    <h1 id="readTitle"></h1>
    <button id="editFromReader" class="primaryButton">编辑</button>
  </header>
  <div id="readerBody" class="readerBody" tabindex="0" aria-label="文稿正文"><article id="readBody" class="readText"></article></div>
</section>
<section id="editor" class="editor" aria-label="文稿编辑页" hidden>
  <header class="editorBar">
    <button id="backEditor" class="icon backButton" aria-label="返回阅读页或列表">←</button>
    <input id="titleInput" type="text" placeholder="输入标题" aria-label="文稿标题" maxlength="300">
    <select id="directorySelect" aria-label="所属目录" title="所属目录"></select>
    <button id="deleteArticle" class="subtleButton danger" hidden>删除</button>
    <button id="saveArticle" class="primaryButton">保存</button>
  </header>
  <textarea id="bodyInput" class="bodyInput" placeholder="从这里开始写正文……" aria-label="正文" spellcheck="true"></textarea>
</section>
<div id="modalHost"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
